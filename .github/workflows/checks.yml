name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  adapter:
    name: Adapter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm required tools
        run: command -v bash jq python3 awk

      - name: Shell syntax
        run: |
          bash -n scripts/hermes-status
          bash -n tests/run-tests.sh

      - name: Python syntax
        run: python3 -m py_compile scripts/hermes-safe-io

      - name: Manifest is valid JSON
        run: jq -e 'type == "object"' manifest.json > /dev/null

      - name: Status adapter regression tests
        run: bash tests/run-tests.sh

  status-state:
    name: Launch readiness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt test runtime
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript
      - name: Status lifecycle regression tests
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/qml
